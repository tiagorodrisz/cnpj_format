<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatador de CNPJ e CPF</title>
    <style>
        body10px 0;
            padding: 10px;
            font-size: 16px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #00796b;
            color: #ffffff;
            cursor: pointer;
            border: none;
        }
        button:hover {
            background-color: #004d40;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #00796b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Formatador de CNPJ e CPF</h1>
        <label for="number">Digite o número:</label>
        <input type="text" id="number" placeholder="Digite o CNPJ ou CPF">
        <button onclick="formatNumber()">Formatar</button>
        <button onclick="removeFormat()">Remover Formatação</button>
        <button onclick="copyToClipboard()">Copiar para Área de Transferência</button>
        <p id="result"></p>
    </div>

    <script>
        function formatNumber() {
            let number = document.getElementById('number').value;
            let formattedNumber = number.replace(/\D/g, '');
            if (formattedNumber.length === 11) {
                formattedNumber = formattedNumber.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/, '$1.$2.$3-$4');
            } else if (formattedNumber.length === 14) {
                formattedNumber = formattedNumber.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            }
            document.getElementById('result').innerText = formattedNumber;
        }

        function removeFormat() {
            let number = document.getElementById('number').value;
            let unformattedNumber = number.replace(/\D/g, '');
            document.getElementById('result').innerText = unformattedNumber;
        }

        function copyToClipboard() {
            let result = document.getElementById('result').innerText;
            let tempInput = document.createElement('input');
            tempInput.value = result;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
        }
    </script>
</body>
</html>
